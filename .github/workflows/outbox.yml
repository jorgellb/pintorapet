# Sends the queued emails that failed (and frees lapsed checkouts) every 15 minutes,
# and once a day runs the full pass (Correos tracking, the retention purge) as well:
# Vercel Cron on this plan runs once a day, so a failed order email could wait a day.
# No secret: the site accepts the token GitHub signs for this workflow on main
# (src/lib/server/githubOidc.ts).
name: Outbox

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '40 6 * * *'
  workflow_dispatch:

permissions:
  id-token: write

concurrency:
  group: outbox
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the outbox cron with a GitHub-signed token
        env:
          # Set by GitHub for this run; not user input.
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          token=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=petsdrawings-cron" | jq -r '.value')
          if [ "$SCHEDULE" = '40 6 * * *' ]; then path='/api/cron/outbox/'; else path='/api/cron/outbox/?quick=1'; fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $token" "https://petsdrawings.com$path"
